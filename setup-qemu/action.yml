---
name: Setup QEMU
description: Proxy for docker/setup-qemu-action

inputs:
  image:
    description: QEMU static binaries Docker image (e.g. tonistiigi/binfmt:latest)
    default: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
    required: false
  platforms:
    description: Platforms to install (e.g. arm64,riscv64,arm)
    default: all
    required: false
  reset:
    description: Uninstall current emulators before installation
    default: "false"
    required: false
  cache-image:
    description: Cache binfmt image to GitHub Actions cache backend
    default: "true"
    required: false

outputs:
  platforms:
    description: Available platforms (comma separated)
    value: ${{ steps.setup.outputs.platforms }}

runs:
  using: "composite"
  steps:
    - name: Setup QEMU
      id: setup
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        image: ${{ inputs.image }}
        platforms: ${{ inputs.platforms }}
        reset: ${{ inputs.reset }}
        cache-image: ${{ inputs.cache-image }}

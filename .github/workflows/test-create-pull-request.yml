---
name: Test create-pull-request

on:
  workflow_call: ~
  pull_request:
    paths:
      - create-pull-request/**
      - .github/workflows/test-create-pull-request.yml
  push:
    branches:
      - main
    paths:
      - create-pull-request/**
      - .github/workflows/test-create-pull-request.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-slim
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src

      # A clean checkout of the default branch has no changes, so no branch is pushed and no pull request is opened.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo

      - name: Run action
        id: cpr
        uses: ./src/create-pull-request
        with:
          path: repo
          branch: test-create-pull-request/${{ github.run_id }}-${{ matrix.os }}

      - name: Verify no-op
        shell: bash
        env:
          OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          [ "$OPERATION" = "none" ]
